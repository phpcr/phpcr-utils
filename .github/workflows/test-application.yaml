name: Test application

on:
    pull_request:
    push:
        branches:
            - '[0-9]+.x'
            - '[0-9]+.[0-9]+'
            - '[0-9]+.[0-9]+.x'

jobs:
    test:
        name: "PHP ${{ matrix.php-version }} ${{ matrix.dependencies }} ${{ matrix.dev-dependencies && 'dev' }}"
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    - php-version: '8.0'
                      dependencies: 'lowest'
                      symfony-version: '*'
                    - php-version: '8.1'
                      symfony-version: '6.*'
                    - php-version: '8.2'
                      symfony-version: '7.*'
                    - php-version: '8.3'
                      symfony-version: '7.*'
                    - php-version: '8.4'
                      symfony-version: '8.*'
                    - php-version: '8.5'
                      symfony-version: '8.*'

        steps:
            - name: Checkout project
              uses: actions/checkout@v3

            - name: Install and configure PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  tools: 'composer:v2, flex'

            - name: Symfony version
              if: matrix.symfony-version != '*'
              run: composer config extra.symfony.require ${{ matrix.symfony-version }}

            - name: Allow unstable dependencies
              if: matrix.dev-dependencies == true
              run: composer config minimum-stability dev

            - name: Install dependencies with Composer
              uses: ramsey/composer-install@v2
              with:
                  dependency-versions: ${{ matrix.dependencies }}
                  composer-options: --prefer-dist

            - name: Execute test cases
              run: vendor/bin/phpunit

    php-windows:
        name: "PHP Windows ${{ matrix.php-version }} ${{ matrix.dependencies }} ${{ matrix.dev-dependencies && 'dev' }}"
        runs-on: windows-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    - php-version: '8.1'

        steps:
            - name: Checkout project
              uses: actions/checkout@v3

            - name: Install and configure PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  tools: 'composer:v2'

            - name: Allow unstable dependencies
              if: matrix.dev-dependencies == true
              run: composer config minimum-stability dev

            - name: Install dependencies with Composer
              uses: ramsey/composer-install@v2
              with:
                  dependency-versions: ${{ matrix.dependencies }}
                  composer-options: --prefer-dist

            - name: Execute test cases
              run: vendor/bin/phpunit
